[project]
name = "marketlab"
version = "0.1.0"
description = "Local market research infrastructure"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "sqlalchemy[asyncio]>=2.0,<3",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "redis>=5.2,<7",
  "httpx>=0.28,<1", "duckdb>=1.2,<2", "pyarrow>=19,<24",
  "ollama>=0.4,<1", "prometheus-client>=0.21,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "hypothesis>=6.125,<7", "ruff>=0.9,<1", "mypy>=1.15,<2", "uv==0.13.5"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketlab"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a running PostgreSQL server"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "scripts/ollama_smoke.py"]

