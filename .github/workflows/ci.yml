name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: npm ci
        working-directory: demo
      - run: npm run lint
        working-directory: demo
      - run: npm test
        working-directory: demo
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-browser-report
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked pytest -m "not integration"
  integration:
    runs-on: ubuntu-latest
    env:
      MARKETLAB_DATABASE_URL: postgresql+psycopg://marketlab:marketlab@127.0.0.1:5432/marketlab
    steps:
      - uses: actions/checkout@v4
      - name: Prepare hosted runner capacity for native v2 admission
        shell: bash
        run: |
          if [[ "${GITHUB_ACTIONS:-}" != "true" || "${RUNNER_ENVIRONMENT:-}" != "github-hosted" || "${RUNNER_OS:-}" != "Linux" ]]; then
            echo "Storage preparation requires a disposable GitHub-hosted Linux runner" >&2
            exit 1
          fi
          df -h -- "$GITHUB_WORKSPACE" "${TMPDIR:-/tmp}"
          # Measure these exact unused bundles; never remove the toolcache root.
          for bundle in \
            /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/lib/jvm /usr/share/swift /opt/microsoft/powershell \
            /opt/hostedtoolcache/Python /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/go /opt/hostedtoolcache/Ruby \
            /usr/lib/llvm-20 /usr/lib/llvm-21 /usr/lib/llvm-22 \
            /usr/local/share/chromium /usr/lib/firefox \
            /etc/skel/.rustup /etc/skel/.cargo /home/runner/.rustup /home/runner/.cargo; do
            if [[ -e "$bundle" || -L "$bundle" ]]; then
              sudo du -x -B1 -s -- "$bundle"
            fi
          done
          # uv installs managed Python next; Node/uv/system Python/Docker stay intact.
          sudo rm -rf -- \
            /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/lib/jvm /usr/share/swift /opt/microsoft/powershell \
            /opt/hostedtoolcache/Python /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/go /opt/hostedtoolcache/Ruby \
            /usr/lib/llvm-20 /usr/lib/llvm-21 /usr/lib/llvm-22 \
            /usr/local/share/chromium /usr/lib/firefox \
            /etc/skel/.rustup /etc/skel/.cargo /home/runner/.rustup /home/runner/.cargo
          docker system df -v
          for image in \
            ghcr.io/dependabot/dependabot-updater-core:latest \
            ghcr.io/github/gh-aw-mcpg:latest \
            ghcr.io/github/gh-aw-firewall/agent:latest \
            ghcr.io/github/gh-aw-firewall/api-proxy:latest \
            ghcr.io/github/gh-aw-firewall/squid:latest \
            ghcr.io/github/github-mcp-server:latest; do
            if docker image inspect --format '{{.Id}} {{.Size}} {{json .RepoTags}}' "$image"; then
              docker image rm -- "$image"
            fi
          done
          docker system df -v
          df -h -- "$GITHUB_WORKSPACE" "${TMPDIR:-/tmp}"
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked
      - run: docker compose config --quiet
      - run: docker compose build api
      - run: docker compose up --detach --wait --wait-timeout 120
      - name: Verify native v2 storage prerequisite after Docker setup
        shell: bash
        run: |
          uv run --locked python - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import tempfile

          # The orphan-rejection test retains one failed 24 GiB attempt while
          # admitting a second 24 GiB attempt; preserve both reservations.
          required = 50 * 1024**3
          checks = []
          for label, path in (
              ("pytest_temp", Path(tempfile.gettempdir()).resolve()),
              ("checkout", Path(os.environ["GITHUB_WORKSPACE"]).resolve()),
          ):
              free = shutil.disk_usage(path).free
              checks.append({"filesystem": label, "path": str(path), "free_bytes": free, "required_bytes": required})
          print(json.dumps(checks), flush=True)
          if any(check["free_bytes"] < required for check in checks):
              for command in (
                  ["docker", "system", "df", "-v"],
                  ["sudo", "du", "-x", "-B1", "--max-depth=2", "/usr", "/opt", "/home/runner", "/var/lib/docker", "/var/lib/containerd"],
              ):
                  try:
                      subprocess.run(command, check=False, timeout=45)
                  except subprocess.TimeoutExpired:
                      print("Read-only capacity diagnostic timed out", flush=True)
              raise SystemExit("Native v2 tests require 50 GiB free on both temporary and checkout filesystems; no tests were skipped")
          PY
      - run: uv run --locked pytest -m integration
      - run: uv run --locked python scripts/api_smoke.py
      - name: Verify Redis initially healthy
        run: uv run --locked python -c "import json, urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=10)); assert r['checks']['redis']['status']=='up', r"
      - name: Verify optional Redis outage
        run: |
          docker compose stop redis
          uv run --locked python scripts/api_smoke.py
          uv run --locked python -c "import json, urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=10)); assert r['status']=='degraded', r; assert r['checks']['redis']['status']=='down', r"
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose down --volumes
