# Separate opt-in stack. Never use this file to recreate original services.
name: marketlab-r8-monitoring
services:
  prometheus:
    image: ${R8_PROMETHEUS_IMAGE:?Set an acquired version@sha256 image identity}
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=512MB
    ports:
      - "127.0.0.1:${R8_PROMETHEUS_PORT:-59090}:9090"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    mem_limit: 384m
    cpus: 0.5
    restart: "no"
    labels:
      marketlab.owner: r8-monitoring
  grafana:
    image: ${R8_GRAFANA_IMAGE:?Set an acquired version@sha256 image identity}
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "127.0.0.1:${R8_GRAFANA_PORT:-53000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    mem_limit: 384m
    cpus: 0.5
    restart: "no"
    labels:
      marketlab.owner: r8-monitoring
volumes:
  prometheus_data:
    labels:
      marketlab.owner: r8-monitoring
  grafana_data:
    labels:
      marketlab.owner: r8-monitoring
